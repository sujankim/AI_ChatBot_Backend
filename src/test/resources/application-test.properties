# ══════════════════════════════════════════════════════
# TEST PROFILE — used by GitHub Actions CI
# In-memory H2 database, fake API keys
# ══════════════════════════════════════════════════════

# ── Database (H2 in-memory — no real DB needed) ───────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA ───────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── JWT ───────────────────────────────────────────────
# Must be a valid Base64 string of at least 32 bytes
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktbm90LXJlYWwtMTIz
app.jwt.access-token-expiry=900000
app.jwt.refresh-token-expiry=604800000

# ── Google OAuth2 (fake values for tests) ─────────────
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# ── Google Gemini AI (fake key for tests) ─────────────
spring.ai.google.genai.api-key=test-gemini-key
spring.ai.google.genai.chat.options.model=gemini-2.0-flash
spring.ai.google.genai.chat.options.temperature=0.7
spring.ai.google.genai.chat.options.max-tokens=100

# ── Frontend URL ──────────────────────────────────────
app.frontend-url=http://localhost:4200

# ── Logging (quiet during tests) ──────────────────────
logging.level.org.springframework.web=WARN
logging.level.com.sujan.chatbot=WARN
logging.level.org.hibernate=WARN