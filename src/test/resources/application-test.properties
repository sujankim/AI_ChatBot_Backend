# ── In-memory H2 database for tests ──────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── H2 supports most Hibernate features ──────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── Disable AI/OAuth for tests ────────────────────────────────────
spring.ai.google.genai.api-key=test-key
spring.security.oauth2.client.registration.google.client-id=test-id
spring.security.oauth2.client.registration.google.client-secret=test-secret

# ── JWT test values ───────────────────────────────────────────────
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktbm90LXJlYWwtMTIz
app.jwt.access-token-expiry=900000
app.jwt.refresh-token-expiry=604800000