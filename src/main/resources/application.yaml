server:
  port: ${PORT:8080}

spring:
  application:
    name: ChatBot

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ===============================
  # Google Gemini AI
  # ===============================
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3-flash-preview
            temperature: 0.7
            maxOutputTokens: 1000

  # ===============================
  # Google OAuth2 Login
  # ===============================
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

  # ===============================
  # JPA / Hibernate Shared Config
  # ===============================
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

# ===============================
# Custom App Properties
# ===============================
app:
  backend-url: ${BACKEND_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 900000
    refresh-token-expiry: 604800000

# ===============================
# Swagger / OpenAPI
# ===============================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# ===============================
# Logging
# ===============================
logging:
  level:
    org.springframework.web: INFO
    com.sujan.chatbot: DEBUG