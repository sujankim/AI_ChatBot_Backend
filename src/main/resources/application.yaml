server:
  port: 8080

spring:
  application:
    name: ChatBot

  datasource:
    #MySQL
    #url: jdbc:mysql://localhost:3306/chatbot_db?useSSL=false&serverTimezone=UTC
    #username: root
    #password: root
    #driver-class-name: com.mysql.cj.jdbc.Driver

    #PostgreSQL
    url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chatbot_db}
    username=${SPRING_DATASOURCE_USERNAME:postgres}
    password=${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name=org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        #dialect: org.hibernate.dialect.MySQLDialect
        dialect=org:
          hibernate:
            dialect:
              PostgreSQLDialect:

  # ===== Google Gemini AI =====
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3-flash-preview
            temperature: 0.7
            maxOutputTokens: 1000

  # ===== Google OAuth2 =====
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

# ===== JWT Configuration =====
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-token-expiry: 900000
    refresh-token-expiry: 604800000   # 7 days in milliseconds

logging:
  level:
    org.springframework.web: INFO
    com.sujan: DEBUG

# ===== Swagger / OpenAPI =====
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true