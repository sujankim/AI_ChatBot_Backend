server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/chatbot_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.springframework.web: INFO
    com.sujan: DEBUG

app:
  frontend-url: http://localhost:4200